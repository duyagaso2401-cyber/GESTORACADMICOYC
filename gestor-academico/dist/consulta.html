<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta Rápida — Gestor Académico YC</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* Página deliberadamente MUY liviana: sin librerías externas, sin
   fuentes web, sin imágenes salvo el logo pequeño — pensada para
   cargar rápido y consumir poco en datos móviles de zonas rurales. */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#001f3f;color:#222;min-height:100vh;padding:14px}
.wrap{max-width:480px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header{text-align:center;color:#fff;padding:10px 0 18px}
.header img{width:52px;height:52px;border-radius:12px;margin-bottom:8px}
.header h1{font-size:1.05rem;font-weight:700}
.header p{font-size:0.78rem;opacity:.85;margin-top:2px}
.est-nombre{font-size:1.15rem;font-weight:800;color:#003366}
.est-grado{font-size:0.85rem;color:#666;margin-top:2px}
.asist-badge{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:20px;font-weight:700;font-size:0.85rem}
.asist-buena{background:#eafaf1;color:#1e8449}
.asist-media{background:#fef9e7;color:#b7950b}
.asist-baja{background:#fdedec;color:#c0392b}
table{width:100%;border-collapse:collapse;font-size:0.82rem;margin-top:6px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid #eee}
th{color:#888;font-weight:600;font-size:0.72rem;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.nota{font-weight:700}
.nota-baja{color:#c0392b}
.nota-media{color:#b7950b}
.nota-buena{color:#1e8449}
.nota-vacia{color:#ccc}
.footer-info{text-align:center;color:#7fb3d3;font-size:0.72rem;margin-top:16px;line-height:1.5}
.estado{text-align:center;padding:40px 20px;color:#fff}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#f1c40f;border-radius:50%;animation:girar 0.8s linear infinite;margin:0 auto 14px}
@keyframes girar{to{transform:rotate(360deg)}}
.error-box{background:#fdedec;border:1px solid #f5b7b1;border-radius:10px;padding:16px;text-align:center;color:#922b21;font-size:0.88rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="/icon-192.png" alt="">
    <h1>Consulta Rápida</h1>
    <p>Gestor Académico YC</p>
  </div>
  <div id="contenido">
    <div class="estado"><div class="spinner"></div>Cargando información...</div>
  </div>
  <div class="footer-info">Este es un resumen simplificado, generado automáticamente.<br>Para el boletín oficial completo, consulte con la institución.</div>
</div>
<script>
(function(){
  function obtenerToken(){
    var params = new URLSearchParams(window.location.search);
    return params.get('token') || '';
  }
  function claseNota(n){
    if(n===null||n===undefined) return 'nota-vacia';
    if(n<3) return 'nota-baja';
    if(n<4) return 'nota-media';
    return 'nota-buena';
  }
  function claseAsistencia(pct){
    if(pct===null||pct===undefined) return 'asist-media';
    if(pct<80) return 'asist-baja';
    if(pct<90) return 'asist-media';
    return 'asist-buena';
  }
  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s==null?'':String(s);
    return d.innerHTML;
  }
  function render(data){
    var cont = document.getElementById('contenido');
    var numPer = data.numPeriodos || 4;
    var headPer = '';
    for(var p=1;p<=numPer;p++) headPer += '<th>P'+p+'</th>';
    var filas = (data.materias||[]).map(function(m){
      var celdas = '';
      for(var p=1;p<=numPer;p++){
        var val = m['p'+p];
        var txt = (val===null||val===undefined) ? '—' : val.toFixed(1);
        celdas += '<td class="nota '+claseNota(val)+'">'+txt+'</td>';
      }
      return '<tr><td>'+escapeHtml(m.materia)+'</td>'+celdas+'</tr>';
    }).join('');
    var tablaHtml = (data.materias&&data.materias.length)
      ? '<table><thead><tr><th>Asignatura</th>'+headPer+'</tr></thead><tbody>'+filas+'</tbody></table>'
      : '<p style="color:#888;font-size:0.85rem;text-align:center;padding:10px 0">Todavía no hay notas registradas.</p>';
    var asistHtml = (data.pctAsistencia===null||data.pctAsistencia===undefined)
      ? ''
      : '<div class="asist-badge '+claseAsistencia(data.pctAsistencia)+'">📅 Asistencia: '+data.pctAsistencia+'%</div>';
    cont.innerHTML =
      '<div class="card" style="text-align:center">'
      + '<div class="est-nombre">'+escapeHtml(data.estudiante)+'</div>'
      + '<div class="est-grado">Grado '+escapeHtml(data.grado)+' · '+escapeHtml(data.institucion)+' · '+escapeHtml(data.anio)+'</div>'
      + asistHtml
      + '</div>'
      + '<div class="card"><h3 style="font-size:0.9rem;color:#003366;margin-bottom:4px">📊 Resumen de Notas</h3>'+tablaHtml+'</div>';
  }
  function renderError(msg){
    document.getElementById('contenido').innerHTML = '<div class="error-box">⚠️ '+escapeHtml(msg)+'</div>';
  }
  var token = obtenerToken();
  if(!token){
    renderError('Enlace incompleto. Pida un nuevo enlace en la institución.');
    return;
  }
  fetch('/api/inetis/consulta-rapida?token='+encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, body:j}; }); })
    .then(function(res){
      if(!res.ok){ renderError(res.body.error||'No se pudo cargar la información.'); return; }
      render(res.body);
    })
    .catch(function(){ renderError('No se pudo conectar. Verifique su conexión a internet e intente de nuevo.'); });
})();
</script>
</body>
</html>
