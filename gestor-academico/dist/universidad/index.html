<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Virtual — Educación Superior</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--
  ══════════════════════════════════════════════════════════════════════
  SISTEMA INDEPENDIENTE DE EDUCACIÓN SUPERIOR
  ------------------------------------------------------------------------
  Esta es una aplicación SEPARADA del portal principal de Gestor
  Académico YC (portal.html) — no carga ninguno de sus módulos JS, no
  comparte su CSS ni su lógica de renderizado. Su único punto de
  contacto con el sistema principal es recibir un token de sesión por
  la URL al momento de entrar (ver app.js), y consumir su propia API
  independiente en /api/university/.
  ══════════════════════════════════════════════════════════════════════
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f1fa;color:#1a1a2e;min-height:100vh}
.topbar{background:linear-gradient(135deg,#4a1a6e 0%,#1a1a4e 100%);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.topbar h1{font-size:1.05rem;font-weight:800}
.topbar .sub{font-size:0.72rem;opacity:.8}
.topbar-right{display:flex;align-items:center;gap:12px;font-size:0.82rem}
.nav{background:#fff;border-bottom:1px solid #e0d8f0;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.nav button{background:none;border:none;padding:12px 16px;font-size:0.85rem;font-weight:600;color:#666;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button.activo{color:#4a1a6e;border-bottom-color:#8e44ad}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h2{font-size:1.05rem;color:#4a1a6e;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(135deg,#8e44ad,#4a1a6e);color:#fff;border-radius:10px;padding:16px;text-align:center}
.kpi .val{font-size:1.6rem;font-weight:900}
.kpi .lbl{font-size:0.7rem;opacity:.9;margin-top:2px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #d8d0e8;border-radius:8px;font-size:0.88rem;font-family:inherit;margin-bottom:10px}
label{display:block;font-size:0.78rem;font-weight:700;color:#555;margin-bottom:4px}
.btn{background:#4a1a6e;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:0.85rem;cursor:pointer}
.btn.verde{background:#1e8449}
.btn.gris{background:#7f8c8d}
.btn-sm{background:#8e44ad;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:0.78rem;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:0.85rem}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid #eee}
th{background:#f4f1fa;color:#4a1a6e;font-size:0.75rem;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
.estado-box{text-align:center;padding:60px 20px;color:#888}
.spinner{width:32px;height:32px;border:3px solid #e0d8f0;border-top-color:#8e44ad;border-radius:50%;animation:girar .8s linear infinite;margin:0 auto 14px}
@keyframes girar{to{transform:rotate(360deg)}}
.error-box{background:#fdedec;border:1px solid #f5b7b1;border-radius:10px;padding:20px;text-align:center;color:#922b21;margin:30px auto;max-width:420px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:16px;padding:32px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.badge-estado{padding:3px 10px;border-radius:12px;font-size:0.72rem;font-weight:700}
.tag-credito{background:#e8daf5;color:#4a1a6e;padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:700}
.progreso-bar{background:#eee;border-radius:6px;height:10px;overflow:hidden}
.progreso-fill{height:10px;background:linear-gradient(90deg,#8e44ad,#4a1a6e)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
.modal-box{background:#fff;border-radius:14px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
</style>
<link rel="stylesheet" href="/css/sync-engine.css">
</head>
<body>
<div id="app">
  <div class="estado-box"><div class="spinner"></div>Cargando Aula Virtual...</div>
</div>
<script src="/modules/02-sheetjs-loader.js"></script>
<script src="app.js"></script>
<script src="/modules/07-sync-engine.js"></script>
<script>
  // Motor de sincronización invisible (sección 6 y 7) para el Sistema
  // Independiente de Educación Superior. app.js guarda el token de sesión
  // universitaria en sessionStorage bajo 'univ_token' (ver su función
  // iniciar()); se lee directamente aquí para armar la cabecera
  // Authorization sin necesidad de tocar el IIFE interno de app.js.
  if (window.SyncEngine) {
    window.SyncEngine.init({
      getAuthHeader: function () {
        var t = sessionStorage.getItem('univ_token');
        return t ? { Authorization: 'Bearer ' + t } : {};
      },
    });
    // autoAttach() YA NO se llama aquí de forma incondicional: ahora
    // depende de si el Súper Admin dejó encendida la sincronización
    // automática para esta institución (por defecto sí). app.js llama a
    // SyncEngine.autoAttach() por su cuenta, solo si corresponde, en
    // cuanto conoce ese dato (ver _actualizarSincUniv() en app.js).
  }
</script>
<script>
  // ══════════════════════════════════════════════════════════════════════
  // 🔑 ACCESO DE RESCATE DEL SÚPER ADMIN (independiente del portal K-12) —
  // NOTA IMPORTANTE (actualizada en la Ronda 4): en el portal K-12
  // (03-app-core.js) este mecanismo ahora verifica la contraseña contra el
  // SERVIDOR (POST /api/inetis/rescate/verificar), porque ahí un token de
  // rescate válido realmente destraba operaciones de datos. AQUÍ, en
  // cambio, el bloqueo real de la Universidad ocurre 100% del lado del
  // servidor (ver verificarInstitucionActiva en src/routes/university.ts)
  // y A PROPÓSITO no tiene ninguna excepción para el Súper Admin — es la
  // "barrera sólida" mencionada en el checklist de despliegue. Por eso
  // esto que sigue es solo un mecanismo LOCAL/cosmético: evita que la
  // pantalla en blanco se siga re-disparando sola en ESTA pestaña, pero
  // NO desbloquea ningún dato real del servidor (las llamadas a
  // /api/university/* seguirán fallando mientras la institución tenga la
  // Pantalla en Blanco activada, sin excepción). Si quiere cambiar esta
  // contraseña, calcule su hash SHA-256 (consola del navegador, F12):
  //   await crypto.subtle.digest('SHA-256', new TextEncoder().encode('SU_NUEVA_CONTRASEÑA'))
  //     .then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))
  // y reemplace el valor de abajo — ya NO necesita coincidir con nada del
  // portal K-12 (ese ahora vive solo en el servidor, vía la variable de
  // entorno RESCATE_SUPER_ADMIN_HASH).
  // ══════════════════════════════════════════════════════════════════════
  (function () {
    const HASH_RESCATE = '7010613a7e0b177b8fb237c038fbac1d8f0f3673479b2514dee2e5c66afd4d31'; // hash de la contraseña de rescate configurada — ver instrucciones arriba para cambiarla
    async function sha256Hex(texto) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }
    let buffer = '';
    window.addEventListener('keyup', function (ev) {
      const act = document.activeElement;
      const enCampo = act && /^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName);
      if (enCampo) return;
      if (!ev.key || ev.key.length !== 1) { buffer = ''; return; }
      buffer = (buffer + ev.key).slice(-5).toLowerCase();
      if (buffer === 'super') {
        buffer = '';
        const pass = prompt('🔑 Acceso de rescate del Súper Admin\n\nEscriba la contraseña maestra:');
        if (pass === null) return;
        sha256Hex(pass).then(function (hash) {
          if (hash === HASH_RESCATE) {
            try { sessionStorage.setItem('es_super_admin', 'true'); } catch (e) {}
            alert('✅ Acceso de rescate activado para esta pestaña.');
            window.location.reload();
          } else {
            alert('❌ Contraseña incorrecta.');
          }
        });
      }
    });
  })();
</script>
</body>
</html>
