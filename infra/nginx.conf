# ════════════════════════════════════════════════════════════════════════════
# RONDA 44 — DIMENSIÓN 10: configuración de Nginx (reverse proxy + gzip).
# Entregable de infraestructura — no se ejecutó Nginx real en este entorno;
# validado solo estructuralmente (bloques balanceados, directivas conocidas).
#
# RONDA 49: se agregó la ruta /.well-known/acme-challenge/ (Let's Encrypt la
# usa para verificar que el dominio es suyo antes de emitir un certificado
# — ver infra/README.md, sección 3). Es la ÚNICA adición de esta ronda a
# este archivo — el resto queda intacto, así que un despliegue que ya
# estaba funcionando en HTTP no cambia de comportamiento. Este archivo
# sigue siendo SOLO HTTP (puerto 80) a propósito: el bloque HTTPS (443) va
# en infra/nginx-ssl.conf.example, que se activa manualmente DESPUÉS de
# obtener el primer certificado (nginx fallaría al arrancar si el bloque
# 443 estuviera aquí desde el principio, apuntando a un certificado que
# todavía no existe).
# ════════════════════════════════════════════════════════════════════════════
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Compresión adicional en el borde (el backend Express ya comprime con
  # `compression` — ver Dimensión 1.1 — pero comprimir también en Nginx es
  # la práctica estándar cuando Nginx sirve como reverse proxy/borde
  # público, por si en el futuro se sirven assets estáticos directamente
  # desde aquí sin pasar por Node).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  upstream gestor_backend {
    server backend:5000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # RONDA 49 — verificación de dominio de Let's Encrypt (HTTP-01
    # challenge). Debe ir ANTES de "location /" para que Nginx la revise
    # primero. La carpeta viene vacía hasta que se ejecuta el comando de
    # certbot del README — no hace nada mientras tanto.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://gestor_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Soporte para SSE (Adán usa Server-Sent Events) — sin buffering, para
      # que los chunks lleguen al cliente en tiempo real.
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
